kind: UDSBundle
metadata:
  name: host-k0s-core-demo
  description: UDS Core standard demo payload for a host k0s cluster
  version: "1.9.0"
packages:
  - name: init
    repository: ghcr.io/zarf-dev/packages/init
    ref: v0.81.1
    keylessVerification:
      certificateIdentityRegexp: https://github\.com/zarf-dev/zarf/\.github/workflows/release\.yml@refs/tags/v\d+\.\d+\.\d+
      certificateOIDCIssuer: https://token.actions.githubusercontent.com
  - name: core
    repository: ghcr.io/defenseunicorns/packages/uds/core
    ref: 1.9.0-upstream
    optionalComponents:
      - istio-passthrough-gateway
      - istio-egress-gateway
      - metrics-server
      - envoy-gateway
      - envoy-default-gateway
    overrides:
      istio-admin-gateway:
        uds-istio-config:
          variables:
            - name: ADMIN_TLS_CERT
              path: tls.cert
            - name: ADMIN_TLS_KEY
              path: tls.key
      istio-tenant-gateway:
        uds-istio-config:
          variables:
            - name: TENANT_TLS_CERT
              path: tls.cert
            - name: TENANT_TLS_KEY
              path: tls.key
      keycloak:
        keycloak:
          variables:
            - name: INSECURE_ADMIN_PASSWORD_GENERATION
              path: insecureAdminPasswordGeneration.enabled
